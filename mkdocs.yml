site_name: Entanglement-Enhanced NLP
site_description: Quantum-inspired Natural Language Processing framework
site_author: Krishna Bajpai
site_url: https://krish567366.github.io/entanglement-enhanced-nlp/

repo_name: krish567366/entanglement-enhanced-nlp
repo_url: https://github.com/krish567366/entanglement-enhanced-nlp

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/krish567366/entanglement-enhanced-nlp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/entanglement-enhanced-nlp/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: usage.md
  - Documentation:
    - API Reference: api.md
    - CLI Tool: cli.md
    - Architecture: architecture.md
  - Theory:
    - Quantum NLP Concepts: theory.md
  - Examples:
    - Jupyter Notebooks: examples.md
